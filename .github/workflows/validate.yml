name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install APM v0.28.0
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output apm-linux-x86_64.tar.gz \
            https://github.com/microsoft/apm/releases/download/v0.28.0/apm-linux-x86_64.tar.gz
          printf '%s  %s\n' \
            '7edab3baba96658a20120fc8f3012e3223da7924937a8cbf169bf9805853b8d7' \
            'apm-linux-x86_64.tar.gz' | sha256sum --check --strict
          sudo mkdir --parents /opt/apm
          sudo tar --extract --gzip --strip-components 1 \
            --file apm-linux-x86_64.tar.gz --directory /opt/apm
          sudo ln --symbolic /opt/apm/apm /usr/local/bin/apm
          apm --version

      - name: Install build dependencies
        run: make setup

      - name: Validate sources and generated packages
        run: make validate
