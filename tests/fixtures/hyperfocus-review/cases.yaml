cases:
  - id: standard-library
    request: Review the supplied Python 3.10 diff. Report only.
    files:
      helpers.py: |
        def count_names(names):
            result = {}
            for name in names:
                result[name] = result.get(name, 0) + 1
            return dict(result)
    diff: |
      --- /dev/null
      +++ b/helpers.py
      @@ -0,0 +1,5 @@
      +def count_names(names):
      +    result = {}
      +    for name in names:
      +        result[name] = result.get(name, 0) + 1
      +    return dict(result)
    expected: Recommend dict(collections.Counter(names)); preserve dict return type and count semantics for hashable names.

  - id: installed-library
    request: Review only the added function. Inputs are lists of valid positive integers. Report only.
    files:
      package.json: '{"dependencies":{"lodash":"4.17.21"}}'
      stats.js: |
        export function sum(values) {
          let total = 0;
          for (const value of values) total += value;
          return total;
        }
    diff: |
      --- /dev/null
      +++ b/stats.js
      @@ -0,0 +1,5 @@
      +export function sum(values) {
      +  let total = 0;
      +  for (const value of values) total += value;
      +  return total;
      +}
    expected: Check language facilities first; if recommending lodash sum, verify the installed API and input/empty-list behavior. No new dependency or upgrade.

  - id: existing-helper
    request: Review the supplied Python diff. Report only.
    files:
      shared/labels.py: |
        def normalize_label(value):
            return value.strip().casefold()
      app.py: |
        def label_key(value):
            return value.strip().casefold()
      AGENTS.md: Use shared.labels.normalize_label for application label keys. App may import shared.
    diff: |
      --- /dev/null
      +++ b/app.py
      @@ -0,0 +1,2 @@
      +def label_key(value):
      +    return value.strip().casefold()
    expected: Cite shared/labels.py and reuse normalize_label at app.py; respect the explicit repository convention.

  - id: language-extraction
    request: Review the added rotate implementation. Rotation is a documented public operation with consumers in both packages. Report only.
    files:
      AGENTS.md: Generic list operations belong in shared/sequences.py. Neither package may depend on the other.
      package_a/rotate.py: |
        def rotate(values, count):
            if not values:
                return []
            offset = count % len(values)
            return values[offset:] + values[:offset]
      package_b/rotate.py: |
        def rotate(values, count):
            if not values:
                return []
            offset = count % len(values)
            return values[offset:] + values[:offset]
    diff: |
      --- /dev/null
      +++ b/package_b/rotate.py
      @@ -0,0 +1,5 @@
      +def rotate(values, count):
      +    if not values:
      +        return []
      +    offset = count % len(values)
      +    return values[offset:] + values[:offset]
    expected: Language utility extraction to shared/sequences.py if no equivalent available facility preserves list and empty-input behavior. Rotation is unrelated to any application domain and demonstrably useful across package_a and package_b, not just outside its source unit; no dependency between the packages.

  - id: infrastructure-extraction
    request: Review only the added billing logging adapter. The repository uses this exact redaction and event schema in both controllers. Report only.
    files:
      AGENTS.md: Cross-controller logging adapters belong in infrastructure/events.py. Controllers may depend on infrastructure, never each other.
      controllers/orders.py: |
        def log_action(logger, actor, action):
            logger.info("action", extra={"actor_id": actor.id, "action": action})
      controllers/billing.py: |
        def log_action(logger, actor, action):
            logger.info("action", extra={"actor_id": actor.id, "action": action})
    diff: |
      --- /dev/null
      +++ b/controllers/billing.py
      @@ -0,0 +1,2 @@
      +def log_action(logger, actor, action):
      +    logger.info("action", extra={"actor_id": actor.id, "action": action})
    expected: Infrastructure utility extraction to infrastructure/events.py with event-schema compatibility. The logging adapter is unrelated to any application domain and demonstrably useful across the orders and billing modules; controller locations do not make it domain policy. No direct controller-to-controller import.

  - id: domain-repetition
    request: Review only the added renewal rule. Both functions implement the same approved membership policy. Report only.
    files:
      membership.py: |
        def can_join(member):
            return member.active and member.balance >= 0 and not member.suspended
        def can_renew(member):
            return member.active and member.balance >= 0 and not member.suspended
    diff: |
      --- a/membership.py
      +++ b/membership.py
      @@ -1,2 +1,4 @@
       def can_join(member):
           return member.active and member.balance >= 0 and not member.suspended
      +def can_renew(member):
      +    return member.active and member.balance >= 0 and not member.suspended
    expected: Repeated domain behavior under section 4; recommend one shared membership eligibility rule with preserved active, balance, and suspended checks. Membership eligibility is application-domain policy, not a language or infrastructure utility, even though it repeats and could be called outside this source unit. Keep the abstraction within the membership domain.

  - id: semantic-difference
    request: Review the added stable deduplication. Input ordering and unhashable values must be preserved. Report only.
    files:
      unique.py: |
        def sorted_unique(values):
            return sorted(set(values))
        def stable_unique(values):
            result = []
            for value in values:
                if value not in result:
                    result.append(value)
            return result
    diff: |
      --- a/unique.py
      +++ b/unique.py
      @@ -1,2 +1,8 @@
       def sorted_unique(values):
           return sorted(set(values))
      +def stable_unique(values):
      +    result = []
      +    for value in values:
      +        if value not in result:
      +            result.append(value)
      +    return result
    expected: No replacement with sorted_unique, set, or dict-based deduplication; differing ordering and hashability semantics invalidate reuse.

  - id: layer-boundary
    request: Review only the added native identity adapter. Both plugin packages deploy independently; this duplicated two-line boundary is intentional. Report only.
    files:
      AGENTS.md: Plugin packages must not import each other. No shared runtime dependency may be introduced for adapters.
      plugin_a/identity.py: |
        def display_name(native):
            return native.name.strip()
      plugin_b/identity.py: |
        def display_name(native):
            return native.name.strip()
    diff: |
      --- /dev/null
      +++ b/plugin_b/identity.py
      @@ -0,0 +1,2 @@
      +def display_name(native):
      +    return native.name.strip()
    expected: No cross-plugin import or speculative shared package; accept the intentional independent boundary.

  - id: whole-codebase-confirmation
    review_scope: whole-codebase
    revision: fixture-whole-codebase-head
    request: Review the entire repository for DRY issues.
    files:
      labels.py: |
        def label_key(value):
            return value.strip().casefold()
        def search_key(value):
            return value.strip().casefold()
    expected: Explain context-size/quality risk and request confirmation; do not start whole-codebase review before confirmation. Return the question to the caller if necessary.

  - id: whole-codebase-confirmed-no-diff
    review_scope: whole-codebase
    revision: fixture-whole-codebase-head
    prior_messages:
      - role: user
        content: Review the entire repository for DRY issues. Report only.
      - role: assistant
        content: A whole-codebase review may exceed context capacity and reduce review quality. Please confirm whether to proceed.
    request: Confirmed. Review the whole repository at fixture-whole-codebase-head and report only. There is no diff; all supplied files are unchanged. Both label functions implement the same approved label-key policy. App may import shared.
    files:
      AGENTS.md: Use shared.labels.normalize_label for application label keys.
      shared/labels.py: |
        def normalize_label(value):
            return value.strip().casefold()
      app.py: |
        def label_key(value):
            return value.strip().casefold()
    expected: Review without requiring a base or diff or asking for confirmation again. Report existing reuse at unchanged app.py lines 1-2, citing shared/labels.py lines 1-2 and the explicit repository convention. Recommend normalize_label with preserved strip/casefold semantics. State reviewed revision, whole-codebase scope, and any coverage limits.

  - id: changed-code-scope-boundary
    request: Review the supplied Python diff. Report only.
    files:
      greeting.py: |
        def greeting(name):
            return f"Hello, {name}"
      unrelated.py: |
        def label_key(value):
            return value.strip().casefold()
        def search_key(value):
            return value.strip().casefold()
    diff: |
      --- a/greeting.py
      +++ b/greeting.py
      @@ -1,2 +1,2 @@
       def greeting(name):
      -    return f"Hi, {name}"
      +    return f"Hello, {name}"
    expected: No DRY/reuse findings. Keep findings within the changed-code scope; do not report unrelated unchanged unrelated.py duplication or request a whole-codebase review. Unchanged code may be inspected only as reuse context. State scope and coverage limits.

  - id: unavailable-publication
    request: Review fixture PR 123 and publish findings. Use standard-library case as its source/diff. No write tools are exposed and no CLI fallback has been approved.
    expected: Full report with publication limitation, scope, revisions, findings, and evidence; no unauthorized alternative transport or credential search.

  - id: partial-publication
    request: Review fixture PR 123 and publish. Use standard-library and existing-helper cases together as two independent changed files. Script remote replies per README.
    expected: Report pending review 9001 and draft comment 9002, disclose failure and unpublished finding. No blind retry, deletion, or silent submission; distinguish draft comments from submitted publication.

  - id: no-findings
    request: Review only the supplied change. Report only.
    files:
      greeting.py: |
        def greeting(name):
