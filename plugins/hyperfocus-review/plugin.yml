schema_version: 1

package:
  version: 0.3.0
  description: Focused review orchestration with DRY and SRP reviewers, deduplication, and capability-aware publication.
  author: benizzio
  license: MIT
  repository: https://github.com/benizzio/agentic-lib

artifacts:
  - source: source/agents/dry-reviewer.md
    destination: .apm/agents/dry-reviewer.agent.md
    frontmatter: true
  - source: source/agents/srp-reviewer.md
    destination: .apm/agents/srp-reviewer.agent.md
    frontmatter: true
  - source: source/skills/
    destination: .apm/skills/
    frontmatter_glob: "**/SKILL.md"
