schema_version: 1
target: opencode
package_name: hyperfocus-review-opencode

frontmatter:
  source/agents/dry-reviewer.md:
    mode: subagent
    permissions:
      - {action: "*", resource: "*", effect: ask}
      - {action: read, resource: "*", effect: allow}
      - {action: read, resource: "*.env", effect: deny}
      - {action: read, resource: "*.env.*", effect: deny}
      - {action: read, resource: "*.env.example", effect: allow}
      - {action: glob, resource: "*", effect: allow}
      - {action: grep, resource: "*", effect: allow}
      - {action: websearch, resource: "*", effect: allow}
      - {action: webfetch, resource: "*", effect: allow}
      - {action: question, resource: "*", effect: allow}
      - {action: edit, resource: "*", effect: deny}
      - {action: subagent, resource: "*", effect: deny}
      - {action: execute, resource: "*", effect: allow}
      - {action: shell, resource: "*", effect: ask}
      - {action: external_directory, resource: "*", effect: ask}
      - {action: context7_resolve_library_id, resource: "*", effect: allow}
      - {action: context7_query_docs, resource: "*", effect: allow}
      - {action: github_get_me, resource: "*", effect: allow}
      - {action: github_get_file_contents, resource: "*", effect: allow}
      - {action: github_pull_request_read, resource: "*", effect: allow}
      - {action: github_pull_request_review_write, resource: "*", effect: ask}
      - {action: github_add_comment_to_pending_review, resource: "*", effect: ask}

tests:
  project_paths:
    - .opencode/agents/dry-reviewer.md
  global_paths:
    - .config/opencode/agents/dry-reviewer.md
